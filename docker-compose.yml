services:
  postgres:
    image: postgres:16-alpine
    container_name: gymloop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gymloop}
      POSTGRES_USER: ${POSTGRES_USER:-gymloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gymloop}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - gymloop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gymloop} -d ${POSTGRES_DB:-gymloop}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gymloop_pgdata:
