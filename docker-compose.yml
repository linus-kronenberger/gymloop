services:
  postgres:
    image: postgres:16-alpine
    container_name: gymloop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gymloop
      POSTGRES_USER: gymloop
      POSTGRES_PASSWORD: gymloop_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymloop -d gymloop"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
