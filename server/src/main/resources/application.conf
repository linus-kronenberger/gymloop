ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.example.gymloop.ApplicationKt.module ]
    }
}

storage {
    driverClassName = "org.postgresql.Driver"
    jdbcUrl = "jdbc:postgresql://localhost:5432/gymloop"
    jdbcUrl = ${?DATABASE_URL}
    user = "gymloop"
    user = ${?DATABASE_USER}
    password = "gymloop_password"
    password = ${?DATABASE_PASSWORD}
}
