name: CI

on:
  push:
    branches: [ main, 'feat/**', 'chore/**', 'fix/**', 'ci/**' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Tests & PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gymloop
          POSTGRES_USER: gymloop
          POSTGRES_PASSWORD: gymloop_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gymloop -d gymloop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify PostgreSQL is ready
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          pg_isready -h localhost -p 5432 -U gymloop -d gymloop

      - name: Run Core & Server Tests
        run: ./gradlew :core:jvmTest :server:test

      - name: Run Shared Multiplatform Tests (Android Host)
        run: ./gradlew :app:shared:testAndroidHostTest

      - name: Assemble Android Debug APK
        run: ./gradlew :app:androidApp:assembleDebug
